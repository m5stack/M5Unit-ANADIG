name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_adc_env.ini'
      - 'unit_dac_env.ini'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'unit_adc_env.ini'
      - 'unit_dac_env.ini'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      
      matrix:
        example:
          - ADCInput
          - DACOutput

        unit:
          - UnitADC11
          - UnitDAC
          - UnitDAC2
#          - HatADC
#          - HatADC11
#          - HatDAC2

        board:
          # Reduced from 19 to 5 boards: one per compile config (chip arch x platform).
          # The other boards differ only in the variant header, so the library code compiles the same.
          - Core
#          - Core2  # ESP32: represented by Core
          - CoreS3
#          - Fire  # ESP32: represented by Core
#          - StampS3  # ESP32-S3: represented by CoreS3
#          - Dial  # ESP32-S3: represented by CoreS3
#          - Atom  # ESP32: represented by Core
#          - AtomS3  # ESP32-S3: represented by CoreS3
#          - AtomS3R  # ESP32-S3: represented by CoreS3
          - NanoC6
          - NanoH2
#          - StickCPlus  # ESP32: represented by Core
#          - StickCPlus2  # ESP32: represented by Core
#          - StickS3  # ESP32-S3: represented by CoreS3
#          - Paper  # ESP32: represented by Core
#          - CoreInk  # ESP32: represented by Core
#          - Cardputer  # ESP32-S3: represented by CoreS3
          - Tab5
#          - NessoN1  # ESP32-C6: represented by NanoC6

        framework:
          - Arduino

        espressif32:
          - latest
#          - '5_4_0'
#          - '4_4_0'

#        exclude:
#          - board: CoreS3
#            espressif32: '5_4_0'
#          - board: CoreS3
#            espressif32: '4_4_0'
#          - board: StampS3
#            espressif32: '5_4_0'
#          - board: StampS3
#            espressif32: '4_4_0'
#          - board: AtomS3
#            espressif32: '5_4_0'
#          - board: AtomS3
#            espressif32: '4_4_0'
#          - board: Dial
#            espressif32: '5_4_0'
#          - board: Dial
#            espressif32: '4_4_0'
#          - board: NanoC6
#            espressif32: '5_4_0'
#          - board: NanoC6
#            espressif32: '4_4_0'
#          - board: StickCPlus
#            espressif32: '5_4_0'
#          - board: StickCPlus
#            espressif32: '4_4_0'
#          - board: Paper
#            espressif32: '5_4_0'
#          - board: Paper
#            espressif32: '4_4_0'

        exclude:
          - example: ADCInput
            unit: UnitDAC
          - example: ADCInput
            unit: UnitDAC2
          - example: DACOutput
            unit: UnitADC11

        include:
          # Specific examples
          # HatADC / HatADC11 / HatDAC2 on ESP32: StickCPlus is represented by StickCPlus2
#         - example: ADCInput
#           framework: Arduino
#           espressif32: latest
#           unit: HatADC
#           board: StickCPlus
#         - example: ADCInput
#           framework: Arduino
#           espressif32: latest
#           unit: HatADC11
#           board: StickCPlus
#         - example: DACOutput
#           framework: Arduino
#           espressif32: latest
#           unit: HatDAC2
#           board: StickCPlus
          - example: ADCInput
            framework: Arduino
            espressif32: latest
            unit: HatADC
            board: StickCPlus2
          - example: ADCInput
            framework: Arduino
            espressif32: latest
            unit: HatADC11
            board: StickCPlus2
          - example: DACOutput
            framework: Arduino
            espressif32: latest
            unit: HatDAC2
            board: StickCPlus2
          # HatADC / HatADC11 / HatDAC2 on ESP32: CoreInk is represented by StickCPlus2
#         - example: ADCInput
#           framework: Arduino
#           espressif32: latest
#           unit: HatADC
#           board: CoreInk
#         - example: ADCInput
#           framework: Arduino
#           espressif32: latest
#           unit: HatADC11
#           board: CoreInk
#         - example: DACOutput
#           framework: Arduino
#           espressif32: latest
#           unit: HatDAC2
#           board: CoreInk
          - example: ADCInput
            framework: Arduino
            espressif32: latest
            unit: HatADC
            board: StickS3
          - example: ADCInput
            framework: Arduino
            espressif32: latest
            unit: HatADC11
            board: StickS3
          - example: DACOutput
            framework: Arduino
            espressif32: latest
            unit: HatDAC2
            board: StickS3
          - example: ADCInput
            framework: Arduino
            espressif32: latest
            unit: HatADC
            board: NessoN1
          - example: ADCInput
            framework: Arduino
            espressif32: latest
            unit: HatADC11
            board: NessoN1
          - example: DACOutput
            framework: Arduino
            espressif32: latest
            unit: HatDAC2
            board: NessoN1
          - example: ViaPaHub
            framework: Arduino
            espressif32: latest
            board: Core
          - example: ViaPaHub
            framework: Arduino
            espressif32: latest
            board: CoreS3
          - example: ViaPaHub
            framework: Arduino
            espressif32: latest
            board: NanoC6
          - example: ViaPaHub
            framework: Arduino
            espressif32: latest
            board: NanoH2
          - example: ViaPaHub
            framework: Arduino
            espressif32: latest
            board: Tab5
#          # NessoN1: same compile config as NanoC6 (env kept in platformio.ini for on-board checks)
#          - example: ViaPaHub
#            framework: Arduino
#            espressif32: latest
#            board: NessoN1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.unit != '' && format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) || format('{0}_{1}_{2}_{3}', matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
